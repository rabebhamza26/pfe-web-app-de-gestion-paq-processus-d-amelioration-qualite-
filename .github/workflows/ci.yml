name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:

  # ─────────────────────────────────────────────
  # JOB 1 — Backend Spring Boot
  # ─────────────────────────────────────────────
  backend:
    name: Backend - Test & Build
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: paq_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: ✅ Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📦 Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: ⏳ Wait for MySQL to be ready
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -u root -proot --silent; then
              echo "MySQL is ready!"
              break
            fi
            echo "Waiting for MySQL... ($i)"
            sleep 2
          done

      - name: 🧪 Run Tests & Build JAR
        working-directory: ./paq-backend
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/paq_db
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: 
          SPRING_PROFILES_ACTIVE: test
        run: mvn clean verify -B

      - name: 📤 Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: paq-backend-jar
          path: paq-backend/target/*.jar

  # ─────────────────────────────────────────────
  # JOB 2 — Frontend React
  # ─────────────────────────────────────────────
  frontend:
    name: paq-leoni - Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: paq-leoni/package-lock.json

      - name: 📦 Install dependencies
        working-directory: ./paq-leoni
        run: npm ci

      - name: 🧪 Run Tests
        working-directory: ./paq-leoni
        run: npm test -- --watchAll=false --passWithNoTests

      - name: 🏗️ Build React app
        working-directory: ./paq-leoni
        run: npm run build

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: paq-leoni/build/

  # ─────────────────────────────────────────────
  # JOB 3 — Docker Build Check
  # ─────────────────────────────────────────────
  docker:
    name: Docker - Build Images
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: ✅ Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Build Backend Docker image
        run: docker build -t my-backend ./paq-backend

      - name: 🐳 Build Frontend Docker image
        run: docker build -t my-frontend ./paq-leoni

  services:
  mysql:
    image: mysql:8.0
    env:
      MYSQL_ROOT_PASSWORD: 
      MYSQL_DATABASE: paq_db
    ports:
      - 3306:3306
    options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3