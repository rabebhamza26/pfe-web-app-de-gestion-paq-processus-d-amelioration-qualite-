name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:

  # ─────────────────────────────────────────────
  # JOB 1 — Backend Spring Boot
  # ─────────────────────────────────────────────
  backend:
    name: Backend - Test & Build
    runs-on: ubuntu-latest
    # ❌ REMOVE the MySQL service - we use H2 for tests

    steps:
      - name: ✅ Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📦 Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: 🧪 Run Tests & Build JAR
        working-directory: ./paq-backend
        env:
          SPRING_PROFILES_ACTIVE: test
        run: mvn clean verify -B -Dspring.profiles.active=test

      - name: 📤 Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: paq-backend-jar
          path: paq-backend/target/*.jar

  # ─────────────────────────────────────────────
  # JOB 2 — Frontend React
  # ─────────────────────────────────────────────
  frontend:
    name: paq-leoni - Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: paq-leoni/package-lock.json

      - name: 📦 Install dependencies
        working-directory: ./paq-leoni
        run: npm ci

      - name: 🧪 Run Tests
        working-directory: ./paq-leoni
        run: npm test -- --watchAll=false --passWithNoTests

      - name: 🏗️ Build React app
        working-directory: ./paq-leoni
        run: npm run build

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: paq-leoni/build/

  # ─────────────────────────────────────────────
  # JOB 3 — Docker Build Check
  # ─────────────────────────────────────────────
  docker:
    name: Docker - Build Images
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: ✅ Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Build Backend Docker image
        run: docker build -t my-backend ./paq-backend

      - name: 🐳 Build Frontend Docker image
        run: docker build -t my-frontend ./paq-leoni