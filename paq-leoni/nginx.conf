# Bloc principal du serveur Nginx.
server {
    # Écoute sur le port HTTP standard 80.
    listen 80;

    # Gère toutes les requêtes envoyées à la racine du site.
    location / {
        # Chemin des fichiers statiques construits par le frontend.
        root /usr/share/nginx/html;
        # Fichier par défaut servi lorsqu'on arrive sur /.
        index index.html;
        # Si le fichier demandé n'existe pas, retourne index.html.
        # Cela permet de gérer les routes côté client pour une SPA.
        try_files $uri $uri/ /index.html;
    }
}





