# H2 database for tests
# Utilise une base H2 en mémoire pour exécuter les tests sans dépendance externe.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
# Connecteur JDBC pour H2.
spring.datasource.driver-class-name=org.h2.Driver
# Identifiant de connexion par défaut pour H2.
spring.datasource.username=sa
# Mot de passe vide car la base H2 en mémoire n'en nécessite pas.
spring.datasource.password=
# Dialecte Hibernate pour H2.
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Crée le schéma au démarrage et le supprime à l'arrêt.
spring.jpa.hibernate.ddl-auto=create-drop
# Affiche les requêtes SQL dans la console pour debug.
spring.jpa.show-sql=true
# Formate proprement le SQL affiché dans les logs.
spring.jpa.properties.hibernate.format_sql=true

# Disable security for tests (optional)
# Paramètres simples pour authentification en tests.
spring.security.user.name=test
spring.security.user.password=test

# Logging
# Active les logs SQL Hibernate en niveau DEBUG.
logging.level.org.hibernate.SQL=DEBUG